appId: com.cluely.desktop
productName: Otto
copyright: Otto study build

# Where the auto-updater looks for new versions. Public repo, so no token
# needed — electron-builder writes latest.yml to each release and the app polls
# these releases on launch.
publish:
  provider: github
  owner: Keugene11
  repo: cluely
  releaseType: release # publish live (not draft) so the update feed is public

directories:
  output: dist-desktop
  buildResources: build

# The desktop shell needs its own sources plus electron-updater (and its
# dependency tree) at runtime. electron-builder bundles production dependencies
# automatically; the web-side deps (Next, React, the SDK) ride along unused but
# guarantee the updater's tree is present — correctness over a smaller download.
files:
  - electron/**/*
  - package.json

# Trim the packaged node_modules to just what main.js requires at runtime.
# (Everything else — Next, React, the SDK — runs server-side on Vercel.)
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

# Space-free artifact name so the update-feed URLs stay clean.
artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Otto

# macOS block kept for reference; building a mac target needs a Mac.
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.productivity
